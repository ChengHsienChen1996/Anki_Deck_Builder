<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anki 記憶引擎</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0f0f17;--bg2:#161623;--bg3:#1e1e2e;--panel:#1a1a28;
  --accent:#7c6af7;--accent2:#9d8df9;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--free:#fb923c;
  --text:#e8e8f0;--dim:#8b8ba3;--line:#2a2a3d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--accent)}

/* ── Sidebar ── */
#sidebar{width:250px;min-width:250px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:all .25s ease;overflow:hidden}
#sidebar.collapsed{width:52px;min-width:52px}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:17px;white-space:nowrap}
.logo small{display:block;color:var(--dim);font-weight:400;font-size:11px}
#collapseBtn{width:26px;height:26px;border-radius:6px;color:var(--dim);font-size:15px;flex-shrink:0}
#collapseBtn:hover{background:var(--bg3);color:var(--text)}
#sidebar.collapsed .logo,#sidebar.collapsed .deck-name,#sidebar.collapsed .deck-due,#sidebar.collapsed .side-foot span{display:none}
#sidebar.collapsed .side-head{justify-content:center;padding:16px 0}
.deck-list{flex:1;overflow-y:auto;padding:10px 8px}
.deck-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:14px}
.deck-item:hover{background:var(--bg3)}
.deck-item.active{background:rgba(124,106,247,.15);color:var(--accent2)}
.deck-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.deck-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-due{font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px;flex-shrink:0}
.side-foot{border-top:1px solid var(--line);padding:10px 8px}
.side-foot button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--dim)}
.side-foot button:hover{background:var(--bg3);color:var(--text)}
#sidebar.collapsed .deck-item,#sidebar.collapsed .side-foot button{justify-content:center;padding:9px 0}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.tab{padding:8px 16px;border-radius:8px;font-size:14px;color:var(--dim)}
.tab:hover{color:var(--text)}
.tab.active{background:rgba(124,106,247,.15);color:var(--accent2)}
#topbar .spacer{flex:1}
.load-btn{padding:8px 14px;border-radius:8px;font-size:13px;background:var(--accent);color:#fff}
.load-btn:hover{background:var(--accent2)}
.load-btn.alt{background:var(--bg3);color:var(--text)}
#content{flex:1;overflow-y:auto;padding:24px}

/* ── Today / stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat-card .num{font-size:30px;font-weight:700;color:var(--accent2)}
.stat-card .lbl{font-size:12px;color:var(--dim);margin-top:4px}
.section-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin:22px 0 12px}
.section-title .mini-btn{font-size:12px;color:var(--dim);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.section-title .mini-btn:hover{color:var(--warn);border-color:var(--warn)}
.due-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.due-row:hover{border-color:var(--accent)}
.due-row .dd{width:10px;height:10px;border-radius:50%}
.due-row .dn{flex:1;font-size:14px}
.due-row .dc{font-size:13px;color:var(--accent2)}
.due-row .go{color:var(--dim)}
.empty-hint{color:var(--dim);font-size:14px;padding:20px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.free-box{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.free-box select{flex:1;max-width:320px}
.free-go{padding:8px 18px;border-radius:8px;background:var(--free);color:#1a1005;font-weight:600;font-size:13px}
.setting-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:14px}
.setting-row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.setting-row .desc{color:var(--dim);font-size:12px;margin-left:auto}

/* ── Review ── */
#review-wrap{max-width:760px;margin:0 auto}
.rev-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rev-head .deck{font-size:14px;color:var(--dim)}
.rev-head .prog{font-size:13px;color:var(--accent2)}
.badge-free{background:var(--free);color:#1a1005;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px}
.rev-head .exit{margin-left:auto;color:var(--dim);font-size:18px;padding:4px 10px;border-radius:8px}
.rev-head .exit:hover{background:var(--bg3);color:var(--text)}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;perspective:900px}
.card-box.flipped{cursor:default}
.hint-chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:3px 12px}
.card-media img{max-width:640px;max-height:360px;width:100%;object-fit:contain;border-radius:12px;display:block}
.card-media audio{margin-top:10px;width:300px;height:36px}
.front-text{font-size:34px;font-weight:700;text-align:center;line-height:1.4}
.reading-text{font-size:17px;color:var(--accent2);letter-spacing:.05em}
.back-text{font-size:24px;font-weight:600;text-align:center;line-height:1.5}
.example-box{font-size:15px;color:var(--text);background:var(--bg3);border-radius:10px;padding:12px 18px;line-height:1.7;max-width:600px}
.example-box .tr{color:var(--dim);font-size:13px}
.extra{font-size:13px;color:var(--dim);max-width:600px;line-height:1.6}
.cloze{color:var(--accent2);font-weight:700;border-bottom:2px dashed var(--accent)}
.cloze-ans{color:var(--ok);font-weight:700}
.flip-tip{color:var(--dim);font-size:12px;margin-top:8px}
.grade-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.grade-btn{padding:14px 8px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.grade-btn small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}
.grade-btn:hover{transform:translateY(-2px)}
.g1:hover{border-color:var(--bad);color:var(--bad)}
.g2:hover{border-color:var(--warn);color:var(--warn)}
.g3:hover{border-color:var(--accent2);color:var(--accent2)}
.g4:hover{border-color:var(--ok);color:var(--ok)}
.done-box{text-align:center;padding:60px 20px}
.done-box .big{font-size:52px}
.done-box h2{margin:14px 0 8px}
.done-box p{color:var(--dim);font-size:14px;line-height:1.8}
.done-box button{margin-top:22px;padding:10px 26px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px}

/* ── Browse ── */
.browse-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.browse-bar input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--bg2)}
.tag-pill{display:inline-block;font-size:11px;background:var(--bg3);border-radius:8px;padding:1px 8px;margin:1px 2px 1px 0;color:var(--dim)}

/* ── Toast ── */
#toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 20px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.toast.ok{border-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-head">
    <div class="logo">ANKI<small>記憶引擎 v1.1</small></div>
    <button id="collapseBtn" title="收納側欄">‹</button>
  </div>
  <div class="deck-list" id="deckList"></div>
  <div class="side-foot">
    <button id="exportBtn">📤 <span>匯出進度</span></button>
    <button id="clearBtn">🗑 <span>清除資料</span></button>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button class="tab active" data-tab="today">📊 今日</button>
    <button class="tab" data-tab="review">🎴 複習</button>
    <button class="tab" data-tab="browse">🗂 瀏覽</button>
    <div class="spacer"></div>
    <button class="load-btn alt" id="folderBtn" style="display:none">📂 資料夾</button>
    <button class="load-btn" id="zipBtn">📦 ZIP</button>
    <input type="file" id="zipInput" accept=".zip" hidden>
  </div>
  <div id="content"></div>
</div>
<div id="toast-wrap"></div>

<script>
/* ═══════════ State ═══════════ */
const LS_PROG='anki_engine_progress_v1', LS_SET='anki_engine_settings_v1';
let cards=[], media={}, progress={}, settings={autoFront:false, autoBack:true};
let curDeck='__all__', view='today';
let session=null; // {queue:[], idx, deck, mode:'formal'|'free', flipped, total, doneCount}
const DECK_COLORS=['#60a5fa','#c084fc','#4ade80','#facc15','#f9a8d4','#f87171','#5eead4','#fb923c'];

const todayStr=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};

function loadLS(){try{progress=JSON.parse(localStorage.getItem(LS_PROG))||{};}catch(e){progress={};}
  try{Object.assign(settings,JSON.parse(localStorage.getItem(LS_SET))||{});}catch(e){}}
function saveProg(){localStorage.setItem(LS_PROG,JSON.stringify(progress));}
function saveSet(){localStorage.setItem(LS_SET,JSON.stringify(settings));}

/* ═══════════ Toast ═══════════ */
function toast(msg,type=''){const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;w.appendChild(t);
  setTimeout(()=>t.remove(),4200);}

/* ═══════════ CSV ═══════════ */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else{ if(c==='"')q=true;
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(cell);cell=''; if(row.length>1||row[0]!=='')rows.push(row); row=[]; }
      else cell+=c; } }
  if(cell!==''||row.length){row.push(cell);if(row.length>1||row[0]!=='')rows.push(row);}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]??'').trim());return o;});
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nl(s){return esc(s).replace(/\\n/g,'\n');}

/* ═══════════ Loading ═══════════ */
const ENGINE_FIELDS=['card_id','deck','card_type','front','back','hint','image_front','image_back','audio_front','audio_back','video','example','mnemonic','note','tags','category','difficulty','source','created_at','last_reviewed','interval','ease_factor','review_count'];

function ingestRows(rows){
  let skipped=0;const seen=new Set(cards.map(c=>c.card_id));const added=[];
  for(const r of rows){
    if(!r.card_id||!r.front||!r.back){skipped++;continue;}   // tolerate work-CSV rows not yet extracted
    if(seen.has(r.card_id))continue;
    seen.add(r.card_id);added.push(r);
    // seed progress from exported CSV (last_reviewed + interval) if no local record
    if(r.last_reviewed&&r.interval&&!progress[r.card_id]){
      const iv=parseInt(r.interval)||1;
      progress[r.card_id]={interval:iv,ease:parseFloat(r.ease_factor)||2.5,
        count:parseInt(r.review_count)||0,last:r.last_reviewed,next:addDays(r.last_reviewed,iv),
        created:r.created_at||''};
    }
  }
  cards=cards.concat(added);
  return {added:added.length,skipped};
}
function checkMedia(){
  let miss=0;
  for(const c of cards)for(const f of['image_front','image_back','audio_front','audio_back']){
    if(c[f]&&!resolveMedia(c[f]))miss++;
  }
  if(miss>0)toast(`⚠ ${miss} 個媒體檔案缺失（CSV 有引用但檔案不存在）`,'warn');
}
function resolveMedia(path){
  if(!path)return null;
  const p=path.replace(/^\.\//,'');
  if(media[p])return media[p];
  const base=p.split('/').pop();
  for(const k in media)if(k.endsWith('/'+base)||k===base)return media[k];
  return null;
}

async function loadZip(file){
  try{
    const zip=await JSZip.loadAsync(file);
    let csvTexts=[];media={};
    const names=Object.keys(zip.files);
    for(const name of names){
      const f=zip.files[name];if(f.dir)continue;
      const norm=name.replace(/^[^/]*\/(?=media\/|.*\.csv$)/,'');
      if(name.toLowerCase().endsWith('.csv')){csvTexts.push(await f.async('string'));}
      else{
        const blob=await f.async('blob');
        media[norm]=URL.createObjectURL(blob);
        if(norm!==name)media[name]=media[norm];
      }
    }
    if(!csvTexts.length){toast('ZIP 內找不到 CSV 檔','warn');return;}
    cards=[];let tot={added:0,skipped:0};
    for(const t of csvTexts){const r=ingestRows(parseCSV(t));tot.added+=r.added;tot.skipped+=r.skipped;}
    saveProg();afterLoad(tot);
  }catch(e){toast('ZIP 解析失敗：'+e.message,'warn');}
}
async function loadFolder(){
  try{
    const dir=await window.showDirectoryPicker();
    media={};let csvTexts=[];
    async function walk(handle,prefix){
      for await(const [name,h] of handle.entries()){
        if(h.kind==='directory')await walk(h,prefix+name+'/');
        else{const f=await h.getFile();
          if(name.toLowerCase().endsWith('.csv'))csvTexts.push(await f.text());
          else media[prefix+name]=URL.createObjectURL(f);}
      }
    }
    await walk(dir,'');
    if(!csvTexts.length){toast('資料夾內找不到 CSV 檔','warn');return;}
    cards=[];let tot={added:0,skipped:0};
    for(const t of csvTexts){const r=ingestRows(parseCSV(t));tot.added+=r.added;tot.skipped+=r.skipped;}
    saveProg();afterLoad(tot);
  }catch(e){if(e.name!=='AbortError')toast('讀取失敗：'+e.message,'warn');}
}
function afterLoad(tot){
  curDeck='__all__';session=null;
  toast(`✓ 載入 ${tot.added} 張卡片`,'ok');
  if(tot.skipped>0)toast(`略過 ${tot.skipped} 列無效資料（缺 card_id / front / back，可能為未完成抽取的工作檔列）`,'warn');
  checkMedia();
  renderSidebar();switchTab('today');
}

/* ═══════════ Decks & due ═══════════ */
function deckNames(){return [...new Set(cards.map(c=>c.deck||'未分類'))];}
function deckColor(name){const ds=deckNames();return DECK_COLORS[Math.max(0,ds.indexOf(name))%DECK_COLORS.length];}
function cardsOf(deck){return deck==='__all__'?cards:cards.filter(c=>(c.deck||'未分類')===deck);}
function isDue(c){const p=progress[c.card_id];if(!p)return true;return p.next<=todayStr();}
function dueOf(deck){return cardsOf(deck).filter(isDue);}
function reviewedToday(){const t=todayStr();return cards.filter(c=>progress[c.card_id]&&progress[c.card_id].last===t);}

/* ═══════════ SM-2 ═══════════ */
function grade(card,g){
  const id=card.card_id;
  const p=progress[id]||{interval:0,ease:2.5,count:0,last:'',next:todayStr(),created:todayStr()};
  if(!p.created)p.created=todayStr();
  if(g===1){p.ease=Math.max(1.3,p.ease-0.32);p.interval=1;}
  else if(g===2){p.ease=Math.max(1.3,p.ease-0.14);p.interval=p.count===0?1:(p.count===1?3:Math.max(1,Math.round(p.interval*1.2)));}
  else if(g===3){p.interval=p.count===0?1:(p.count===1?6:Math.round(p.interval*p.ease));}
  else{p.ease=p.ease+0.10;p.interval=p.count===0?2:(p.count===1?8:Math.round(p.interval*p.ease*1.3));}
  p.count++;p.last=todayStr();p.next=addDays(todayStr(),p.interval);
  progress[id]=p;saveProg();
}

/* ═══════════ Sidebar ═══════════ */
function renderSidebar(){
  const el=document.getElementById('deckList');
  const ds=deckNames();
  let html=`<div class="deck-item ${curDeck==='__all__'?'active':''}" data-deck="__all__">
    <span style="font-size:14px">📚</span><span class="deck-name">全部</span>
    ${dueOf('__all__').length?`<span class="deck-due">${dueOf('__all__').length}待</span>`:''}</div>`;
  for(const d of ds){
    const due=dueOf(d).length;
    html+=`<div class="deck-item ${curDeck===d?'active':''}" data-deck="${esc(d)}">
      <span class="deck-dot" style="background:${deckColor(d)}"></span>
      <span class="deck-name" title="${esc(d)}">${esc(d)}</span>
      ${due?`<span class="deck-due">${due}待</span>`:''}</div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('.deck-item').forEach(it=>it.onclick=()=>{
    curDeck=it.dataset.deck;renderSidebar();if(view!=='review'||!session)switchTab('today');});
}

/* ═══════════ Views ═══════════ */
function switchTab(t){
  view=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(t==='today')renderToday();
  else if(t==='browse')renderBrowse();
  else if(t==='review'){
    if(session)renderReview();
    else{renderToday();toast('請從「今日待複習」點選牌組開始正式複習，或使用下方自由練習');}
  }
}

function renderToday(){
  const c=document.getElementById('content');
  if(!cards.length){c.innerHTML=`<div class="empty-hint" style="margin-top:60px">
    尚未載入牌組。點擊右上角「📦 ZIP」上傳牌組檔案${'showDirectoryPicker'in window?'，或「📂 資料夾」授權本機資料夾':''}。</div>`;return;}
  const scope=cardsOf(curDeck);
  const learned=scope.filter(x=>progress[x.card_id]).length;
  const rToday=reviewedToday().filter(x=>curDeck==='__all__'||(x.deck||'未分類')===curDeck).length;
  const ds=curDeck==='__all__'?deckNames():[curDeck];
  const dueRows=ds.map(d=>({d,n:dueOf(d).length})).filter(x=>x.n>0);
  c.innerHTML=`
  <div class="stat-grid">
    <div class="stat-card"><div class="num">${scope.length}</div><div class="lbl">總卡片</div></div>
    <div class="stat-card"><div class="num">${dueOf(curDeck).length}</div><div class="lbl">今日到期</div></div>
    <div class="stat-card"><div class="num">${learned}</div><div class="lbl">已學過</div></div>
    <div class="stat-card"><div class="num">${rToday}</div><div class="lbl">今日已複習</div></div>
  </div>
  <div class="section-title">今日待複習
    ${reviewedToday().length?`<button class="mini-btn" id="resetToday">↺ 重置今日進度</button>`:''}</div>
  ${dueRows.length?dueRows.map(x=>`
    <div class="due-row" data-deck="${esc(x.d)}">
      <span class="dd" style="background:${deckColor(x.d)}"></span>
      <span class="dn">${esc(x.d)}</span><span class="dc">${x.n} 張到期</span><span class="go">▶</span>
    </div>`).join(''):`<div class="empty-hint">🎉 沒有到期的卡片，今天輕鬆了</div>`}
  <div class="section-title">自由練習</div>
  <div class="free-box">
    <span style="font-size:13px;color:var(--dim)">瀏覽全部卡片，不影響記憶曲線</span>
    <select id="freeDeck">${['__all__',...deckNames()].map(d=>
      `<option value="${esc(d)}" ${d===curDeck?'selected':''}>${d==='__all__'?'全部牌組':esc(d)}</option>`).join('')}</select>
    <button class="free-go" id="freeGo">▶ 開始練習</button>
  </div>
  <div class="section-title">設定</div>
  <div class="setting-row"><input type="checkbox" id="setAF" ${settings.autoFront?'checked':''}>
    <label for="setAF">正面音訊自動播放</label>
    <span class="desc">單字讀音常是測驗重點，預設關閉避免洩題</span></div>
  <div class="setting-row"><input type="checkbox" id="setAB" ${settings.autoBack?'checked':''}>
    <label for="setAB">翻牌後例句音訊自動播放</label></div>`;
  c.querySelectorAll('.due-row').forEach(r=>r.onclick=()=>startSession(r.dataset.deck,'formal'));
  const rt=document.getElementById('resetToday');
  if(rt)rt.onclick=()=>{
    const t=todayStr();let n=0;
    for(const id in progress)if(progress[id].last===t){progress[id].next=t;n++;}
    saveProg();toast(`已重置 ${n} 張卡片的今日進度（interval / ease 保留）`,'ok');
    renderSidebar();renderToday();};
  document.getElementById('freeGo').onclick=()=>startSession(document.getElementById('freeDeck').value,'free');
  document.getElementById('setAF').onchange=e=>{settings.autoFront=e.target.checked;saveSet();};
  document.getElementById('setAB').onchange=e=>{settings.autoBack=e.target.checked;saveSet();};
}

/* ═══════════ Review session ═══════════ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(deck,mode){
  const pool=mode==='formal'?dueOf(deck):cardsOf(deck).slice();
  if(!pool.length){toast(mode==='formal'?'此牌組今日沒有到期卡片':'此牌組沒有卡片','warn');return;}
  session={queue:shuffle(pool.slice()),idx:0,deck,mode,flipped:false,total:pool.length,doneCount:0};
  view='review';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='review'));
  renderReview();
}
function clozeFront(s){return nl(s).replace(/\{\{c\d+::(.*?)\}\}/g,'<span class="cloze">？？？</span>');}
function clozeBack(s){return nl(s).replace(/\{\{c\d+::(.*?)\}\}/g,'<span class="cloze-ans">$1</span>');}
function mediaHTML(c,side){
  const img=resolveMedia(side==='front'?c.image_front:c.image_back);
  const aud=resolveMedia(side==='front'?c.audio_front:c.audio_back);
  const auto=side==='front'?settings.autoFront:settings.autoBack;
  let h='';
  if(img)h+=`<div class="card-media"><img src="${img}"></div>`;
  if(aud)h+=`<div class="card-media"><audio controls preload="auto" ${auto?'data-auto="1"':''} src="${aud}"></audio></div>`;
  return h;
}
function renderReview(){
  const c=document.getElementById('content');
  const s=session;
  if(!s){renderToday();return;}
  if(s.idx>=s.queue.length){ // done
    c.innerHTML=`<div id="review-wrap"><div class="done-box">
      <div class="big">${s.mode==='formal'?'🎉':'✨'}</div>
      <h2>${s.mode==='formal'?'今日複習完成！':'自由練習結束'}</h2>
      <p>${s.mode==='formal'
        ?`共完成 ${s.doneCount} 次評分。<br>SM-2 已更新記憶曲線，明天見。`
        :`共瀏覽 ${s.doneCount} 次。<br>自由練習不影響記憶曲線與任何進度。`}</p>
      <button id="backToday">回到今日</button></div></div>`;
    document.getElementById('backToday').onclick=()=>{session=null;renderSidebar();switchTab('today');};
    renderSidebar();return;
  }
  const card=s.queue[s.idx];
  const f=s.flipped;
  // example: "日文\n中文" → two lines, translation dimmer
  let exHtml='';
  if(f&&card.example){
    const parts=card.example.split('\\n');
    exHtml=`<div class="example-box">${esc(parts[0])}${parts.slice(1).map(p=>`<div class="tr">${esc(p)}</div>`).join('')}</div>`;
  }
  c.innerHTML=`<div id="review-wrap">
    <div class="rev-head">
      <span class="deck">${s.deck==='__all__'?'全部牌組':esc(s.deck)}</span>
      <span class="prog">${Math.min(s.idx+1,s.total)} / ${s.queue.length}</span>
      ${s.mode==='free'?'<span class="badge-free">自由練習</span>':''}
      <button class="exit" title="結束">✕</button>
    </div>
    <div class="card-box ${f?'flipped':''}" id="cardBox">
      ${!f&&card.hint?`<span class="hint-chip">${esc(card.hint)}</span>`:''}
      ${!f?mediaHTML(card,'front'):''}
      ${!f?`<div class="front-text">${clozeFront(card.front)}</div>`:''}
      ${f?`<div class="front-text" style="font-size:22px;color:var(--dim)">${clozeBack(card.front)}</div>`:''}
      ${f&&card.reading?`<div class="reading-text">${esc(card.reading)}</div>`:''}
      ${f?`<div class="back-text">${nl(card.back)}</div>`:''}
      ${exHtml}
      ${f&&card.mnemonic?`<div class="extra">💡 ${nl(card.mnemonic)}</div>`:''}
      ${f&&card.note?`<div class="extra">📝 ${nl(card.note)}</div>`:''}
      ${f?mediaHTML(card,'back'):''}
      ${!f?`<div class="flip-tip">按空白鍵或點擊卡片翻面</div>`:''}
    </div>
    ${f?`<div class="grade-bar">
      <button class="grade-btn g1" data-g="1">忘記<small>1 · 重新排入</small></button>
      <button class="grade-btn g2" data-g="2">模糊<small>2 · 約3天</small></button>
      <button class="grade-btn g3" data-g="3">記得<small>3 · 依曲線</small></button>
      <button class="grade-btn g4" data-g="4">輕鬆<small>4 · 拉長間隔</small></button>
    </div>`:''}
  </div>`;
  c.querySelector('.exit').onclick=()=>{session=null;renderSidebar();switchTab('today');};
  const box=document.getElementById('cardBox');
  if(!f)box.onclick=()=>{s.flipped=true;renderReview();};
  c.querySelectorAll('.grade-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();doGrade(parseInt(b.dataset.g));});
  const auto=c.querySelector('audio[data-auto]');
  if(auto)auto.play().catch(()=>{});
}
function doGrade(g){
  const s=session;if(!s||!s.flipped)return;
  const card=s.queue[s.idx];
  if(s.mode==='formal')grade(card,g);
  s.doneCount++;
  if(g===1)s.queue.push(card); // forgot → requeue this session (both modes)
  s.idx++;s.flipped=false;
  renderReview();
}

/* ═══════════ Browse ═══════════ */
function renderBrowse(){
  const c=document.getElementById('content');
  if(!cards.length){c.innerHTML=`<div class="empty-hint" style="margin-top:60px">尚未載入牌組</div>`;return;}
  c.innerHTML=`<div class="browse-bar">
    <input id="q" placeholder="搜尋正面 / 背面 / 標籤…">
    <select id="fDeck"><option value="__all__">全部牌組</option>
      ${deckNames().map(d=>`<option ${d===curDeck?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <select id="fType"><option value="">全部類型</option><option>basic</option><option>cloze</option><option>qa</option></select>
  </div><div id="tblWrap"></div>`;
  const draw=()=>{
    const q=document.getElementById('q').value.toLowerCase();
    const fd=document.getElementById('fDeck').value, ft=document.getElementById('fType').value;
    let list=cards.filter(x=>
      (fd==='__all__'||(x.deck||'未分類')===fd)&&(!ft||x.card_type===ft)&&
      (!q||(x.front+x.back+x.tags+(x.reading||'')).toLowerCase().includes(q)));
    document.getElementById('tblWrap').innerHTML=`<table><thead><tr>
      <th>正面</th><th>背面</th><th>牌組</th><th>標籤</th><th>難度</th><th>下次複習</th><th>次數</th></tr></thead>
      <tbody>${list.slice(0,500).map(x=>{const p=progress[x.card_id];return`<tr>
        <td>${esc(x.front)}${x.reading?`<div style="color:var(--dim);font-size:11px">${esc(x.reading)}</div>`:''}</td>
        <td>${esc(x.back)}</td><td style="white-space:nowrap">${esc(x.deck||'未分類')}</td>
        <td>${(x.tags||'').split(/\s+/).filter(Boolean).map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('')}</td>
        <td>${esc(x.difficulty||'—')}</td>
        <td>${p?p.next:'新卡'}</td><td>${p?p.count:0}</td></tr>`;}).join('')}</tbody></table>
      ${list.length>500?`<div class="empty-hint" style="margin-top:10px">僅顯示前 500 筆，請用搜尋縮小範圍</div>`:''}`;
  };
  ['q','fDeck','fType'].forEach(id=>document.getElementById(id).oninput=draw);
  draw();
}

/* ═══════════ Export / clear ═══════════ */
function exportCSV(){
  if(!cards.length){toast('沒有可匯出的資料','warn');return;}
  const rows=[ENGINE_FIELDS.join(',')];
  const quote=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  for(const c of cards){
    const p=progress[c.card_id]||{};
    const o={...c,created_at:p.created||c.created_at||'',last_reviewed:p.last||'',
      interval:p.interval??'',ease_factor:p.ease?p.ease.toFixed(2):'',review_count:p.count??''};
    rows.push(ENGINE_FIELDS.map(f=>quote(o[f])).join(','));
  }
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`anki_progress_${todayStr()}.csv`;a.click();
  toast('✓ 進度已匯出','ok');
}

/* ═══════════ Wire up ═══════════ */
document.getElementById('collapseBtn').onclick=function(){
  const s=document.getElementById('sidebar');s.classList.toggle('collapsed');
  this.textContent=s.classList.contains('collapsed')?'›':'‹';};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.getElementById('zipBtn').onclick=()=>document.getElementById('zipInput').click();
document.getElementById('zipInput').onchange=e=>{if(e.target.files[0])loadZip(e.target.files[0]);e.target.value='';};
if('showDirectoryPicker'in window){const fb=document.getElementById('folderBtn');fb.style.display='';fb.onclick=loadFolder;}
document.getElementById('exportBtn').onclick=exportCSV;
document.getElementById('clearBtn').onclick=()=>{
  if(confirm('確定清除所有進度與已載入的卡片？此操作不可還原，建議先匯出進度。')){
    localStorage.removeItem(LS_PROG);progress={};cards=[];media={};session=null;
    renderSidebar();switchTab('today');toast('已清除所有資料');}};
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(view!=='review'||!session)return;
  if(e.code==='Space'){e.preventDefault();if(!session.flipped){session.flipped=true;renderReview();}}
  else if(['1','2','3','4'].includes(e.key)&&session.flipped)doGrade(parseInt(e.key));
});

loadLS();renderSidebar();switchTab('today');
</script>
