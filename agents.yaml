# agent_factory 的 agent 宣告。
#
# 置於專案根目錄的理由：YAML 的 ${__dir__} 解析為「本檔所在目錄」，
# 放根目錄後 ${__dir__}/prompts/ 恰好對上專案規範的根層 prompts/。
# 詳見 docs/architecture.md〈為何 agents.yaml 置於專案根目錄〉。
#
# endpoint 與模型名寫在這裡、**不放 .env** —— 這是 agent_factory 的設計，
# 同一份 .env 可搭配不同 YAML 切換供應商。

# ── 供應商：本地 Ollama ──────────────────────────────────────────
ollama: &ollama
  client:
    # Ollama 不驗證金鑰，但 AsyncOpenAI 要求非空字串
    api_key: ${oc.env:OPENAI_API_KEY, 'ollama'}
    base_url: http://localhost:11434/v1
    # client 區塊會原樣傳進 AsyncOpenAI(**client)。
    # 預設是「600 秒逾時 + 重試 2 次」，一次卡住要耗掉 30 分鐘才回報；
    # 本地模型逾時多半是設定問題（模型沒全載進 VRAM），重試不會變好，
    # 因此關掉重試，讓問題在 10 分鐘內浮現。
    timeout: 600
    max_retries: 0

# ── 模型 ────────────────────────────────────────────────────────
# limits 的優先序高於 MODEL_LIMITS，因此本專案不需修改 submodule，
# 也不需在啟動時注入 MODEL_LIMITS。
#
# 本地模型一律 concurrency_only：本地推理無帳單，TPM／RPM 不對應任何真實約束，
# 真正的瓶頸是 GPU 序列化執行，唯一有意義的管制是併發數（GLOBAL_CONCURRENCY）。
models:
  # 抽取模型選 E4B（8B）而非 31B。實測比較（2026-08-23，見執行計畫 §2.6）：
  #   31B：日文 13 條目 157s；英文單字表 25 條目吐壞 JSON；整頁 94 條目需 40 分鐘，
  #        且關閉 thinking 後不論切多小都只回 1 張卡
  #   E4B：日文 13 條目 63.5s、英文 25 條目 63.7s 一次過，整頁推估 4~5 分鐘
  # E4B 原本會把 deck 全填成 Vocabulary，已於 prompt 加禁令修正。
  extract-llm: &model_extract
    <<: *ollama
    model: gemma4-e4b-optimized:latest
    params:
      temperature: 0.0
    limits:
      policy: concurrency_only

  # 切回 31B：把上面 extract-llm 的 model 換成下列任一個即可。
  # 三個變體只差 num_ctx，權重層共用、不佔額外磁碟：
  #   gemma4_31b_q4_K_M-8K   （8192）  KV cache 最小、VRAM 餘裕最多
  #   gemma4_31b_q4_K_M-12K  （12288）
  #   gemma4_31b_q4_K_M-16K  （16384） 長頁面較不易截斷，但 KV cache 最吃 VRAM
  #
  # ⚠️ 選哪個要看**當下還有多少 VRAM**，不是看哪個數字大。實測 ComfyUI 常駐
  # 佔 2.4 GB 時，31B 只能載入 85~88%，2.6 GB 溢出到 RAM，速度由 34 tok/s
  # 崩到 4~6 tok/s——此時 num_ctx 調再小也救不回來（見執行計畫 §2.6）。

  ocr-glm: &model_ocr
    <<: *ollama
    model: glm-ocr-optimized:latest
    params:
      temperature: 0.0
      # max_tokens 是必要的護欄而非最佳化：實測若不設限，模型會把辨識結果
      # 整段重複播放到 context 耗盡（見 .agent/plans/phase-2-execution-plan.md §1.2）
      max_tokens: 4096
    limits:
      policy: concurrency_only

# ── Agent ───────────────────────────────────────────────────────
agents:
  default:
    - ExtractAgent:
        name: ExtractAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/extract_cards.md
        output_schema: anki_deck_builder.schemas.extract_output.ExtractOutput
        model_params:
          <<: *model_extract

    # OCR 只回傳純文字，**不設 output_schema**——結構化抽取是 ExtractAgent 的職責。
    #
    # GLM-OCR 是 prompt-limited 模型，只吃兩類 prompt：
    #   Document Parsing      —— "Text Recognition:" / "Formula Recognition:" / "Table Recognition:"
    #   Information Extraction —— prompt 內嵌嚴格 JSON schema
    # 自擬指令會讓它退化成無限重複輸出（實測）。prompts/ocr_extract.md 因此
    # 只有一行官方前綴，**不要往裡面加任何說明文字**。
    - OCRAgent:
        name: OCRAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/ocr_extract.md
        model_params:
          <<: *model_ocr

    # vision_direct 路徑：影像直送抽取模型，跳過 OCR。
    # 與 ExtractAgent **共用同一個 output_schema**（硬性要求），差別只在
    # prompt 與輸入型態；模型同為 Gemma 4。
    #
    # extra_args 會原樣傳進 chat.completions.create()。reasoning_effort 不是
    # openai-agents 的 ModelSettings 欄位，只能走這裡。
    # **關閉思考是必要的而非最佳化**：實測讀整頁書影像時，4096 個 completion
    # token 會全部被思考吃光，content 回傳空字串、finish_reason=length
    # （見 .agent/plans/phase-2-execution-plan.md §2.3）。
    - VisionExtractAgent:
        name: VisionExtractAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/extract_cards_vision.md
        output_schema: anki_deck_builder.schemas.extract_output.ExtractOutput
        model_params:
          <<: *model_extract
          params:
            temperature: 0.0
            max_tokens: 4096
            extra_args:
              reasoning_effort: none
