# agent_factory 的 agent 宣告。
#
# 置於專案根目錄的理由：YAML 的 ${__dir__} 解析為「本檔所在目錄」，
# 放根目錄後 ${__dir__}/prompts/ 恰好對上專案規範的根層 prompts/。
# 詳見 docs/architecture.md〈為何 agents.yaml 置於專案根目錄〉。
#
# endpoint 與模型名寫在這裡、**不放 .env** —— 這是 agent_factory 的設計，
# 同一份 .env 可搭配不同 YAML 切換供應商。

# ── 供應商：本地 Ollama ──────────────────────────────────────────
ollama: &ollama
  client:
    # Ollama 不驗證金鑰，但 AsyncOpenAI 要求非空字串
    api_key: ${oc.env:OPENAI_API_KEY, 'ollama'}
    base_url: http://localhost:11434/v1
    # client 區塊會原樣傳進 AsyncOpenAI(**client)。
    # 預設是「600 秒逾時 + 重試 2 次」，一次卡住要耗掉 30 分鐘才回報；
    # 本地模型逾時多半是設定問題（模型沒全載進 VRAM），重試不會變好，
    # 因此關掉重試，讓問題在 10 分鐘內浮現。
    timeout: 600
    max_retries: 0

# ── 模型 ────────────────────────────────────────────────────────
# limits 的優先序高於 MODEL_LIMITS，因此本專案不需修改 submodule，
# 也不需在啟動時注入 MODEL_LIMITS。
#
# 本地模型一律 concurrency_only：本地推理無帳單，TPM／RPM 不對應任何真實約束，
# 真正的瓶頸是 GPU 序列化執行，唯一有意義的管制是併發數（GLOBAL_CONCURRENCY）。
models:
  # 抽取模型：31B q4_K_M（2026-09-05 起）。選它的理由是實測，不是參數量。
  #
  # ⚠️ 這一格的註解曾與設定矛盾三天——註解寫著「選 E4B」，`model:` 卻是 26B q8
  # （模型在 cf5262e 這個 **docs commit** 裡被換掉，註解沒跟著改）。
  # 為免重演：**先寫現況、再寫歷史，每條實測都標日期與前提**。
  #
  # ── 為什麼是 31B q4_K_M（2026-09-05 兩頁對照實測）──────────────
  #   同一份 raw_text、同一份 prompt、同一份人工 ground truth，只換 model:
  #
  #                        26B q8 128K      31B q4_K_M 16K
  #     模型大小            29.26 GB         19.71 GB
  #     上卡比例            70%（30% 在 CPU） **100%**
  #     p11 產出            14 張            14 張
  #     p11 reading 正確    13/16            13/16（連錯的都一樣）
  #     p11 一頁耗時        11.8 分          **6.7 分**
  #     p18 產出            15 張            15 張
  #     p18 reading 忠實度  13/15            13/15
  #     p18 一頁耗時        約 13 分         **8.1 分**
  #
  #   **品質打平、速度快 1.7~1.8 倍、VRAM 從吃緊變成有 3 GB 餘裕。**
  #   p18 的三處差異兩邊各有勝負：`凹凸` 31B 較好（修掉 OCR 的 お→あ 誤讀），
  #   `応じる` 26B 較好（31B 的 `おう` 是截斷的）。
  #
  # ── 推翻的舊結論：「E4B 優於 31B」不成立 ─────────────────────
  #   2026-08-23 的紀錄是「31B 整頁 94 條目需 40 分鐘、關閉 thinking 後不論
  #   切多小都只回 1 張卡；速度由 34 tok/s 崩到 4~6 tok/s」。那次量到的是
  #   **兩個混淆變數**，不是模型能力：
  #     1. ComfyUI 常駐 2.4 GB，31B 只載入 85~88% → 被擠出 VRAM。
  #        現在 COMFYUI_FREE_BEFORE_LLM 必開，實測 **100% 上卡**
  #     2. 當時抽取是**整頁送**的。Phase 8 之後改成分段，超長輸入的症狀消失
  #
  #   **舊實測要標明前提，否則會被當成永久事實而擋住正確的選擇。**
  #   附帶一提：`ExtractAgent` 沒設 reasoning_effort（思考是開著的），
  #   31B 開著思考照樣 59~96 秒/次，不需要為它關掉。
  #
  #   ⚠️ 這次**沒有重測 E4B**。能下的結論是「31B q4 不劣於 26B q8 且明顯更快」，
  #   不是「參數量越大越好」——那需要三方同場比較。
  #
  # ── 其他變體與候選 ─────────────────────────────────────────
  #   gemma4_31b_q4_K_M-{8K,12K,16K,64K,128K}  只差 num_ctx，權重層共用、不佔額外磁碟。
  #
  #     ⚠️ **num_ctx 有一道懸崖，位置在 32K 與 64K 之間**。
  #     2026-09-05 在 24 GB 卡上逐一實測（每次都先查 nvidia-smi 確認 GPU 上
  #     沒有別的佔用者，是模型自己撐滿的、不是被擠掉的）：
  #
  #                總大小      在 VRAM     上卡    生成速度
  #       16K      19.71 GB    19.71 GB    100%    31.0 tok/s
  #       32K      19.86 GB    19.86 GB    100%    30.7 tok/s   ← 生效中
  #       64K      21.50 GB    18.91 GB     88%    12.0 tok/s   （慢 2.6 倍）
  #       128K     22.78 GB    17.36 GB     76%    —
  #
  #     **32K 比 16K 只多 0.15 GB、速度差 1%（雜訊範圍）**，等於免費的餘裕，
  #     所以選它——為未來的長文教材預留空間。
  #
  #     但 64K 只再多 1.64 GB 就掉出 VRAM，**12% 的權重跑到 CPU、生成速度掉 2.6 倍**
  #     ——部分卸載的代價遠超過比例。成長也**不是線性的**
  #     （+0.15 / +1.64 / +1.28 GB），**不能用內插去猜，必須逐個實測**。
  #
  #     順帶一提，目前的單字書工作負載遠用不到 32K：實測 21 次抽取呼叫的
  #     context 用量平均 6676、最大 7579 tokens，而且抽取自 Phase 8 起是分段送的。
  #     32K 是為了教材型態改變（文章、長篇）時不必再回頭調。
  #   gemma4_26b-a4b-it-q8_0-{8K,12K,16K,128K}  28.05 GB 權重，**四個變體都塞不進
  #     24 GB**（變體只差 KV cache）。無釋義教材的例句填充較佳（97/97 對 E4B 的
  #     70/101），但要用它就得接受 70% 上卡與 1.8 倍時間。26B 另有 Q4_K_M 版本，
  #     本機尚未 pull——想兼顧品質與 VRAM 的話那是下一個該試的
  #   gemma4-e4b-optimized  8B q8，11.64 GB，完全上卡。2026-08-23~09-02 長期使用，
  #     舊的 342 張卡牌組就是它抽的。弱點是例句填充 70/101，
  #     且原本會把 deck 全填成 Vocabulary（已於 prompt 加禁令修正）
  #   qwen3.8-uncensored-8K  漏抽例句（原文有例句仍填 0），且無 vision 能力
  #
  # ⚠️ **選哪個要看模型大小與當下的 VRAM，不是看參數量或量化位元**。
  # 一旦權重超過 24 GB，num_ctx 調再小都救不回來——KV cache 只是零頭。
  #
  # `scene` 與 `prompt` 也繼承本組，但它們只要 1.8~2.8 秒/張。
  # 抽取那個秒數是**抽取特有的**（整頁輸入、結構化 JSON 輸出），不是模型的固定成本。
  extract-llm: &model_extract
    <<: *ollama
    model: gemma4_31b_q4_K_M-32K
    params:
      temperature: 0.2
    limits:
      policy: concurrency_only

  ocr-glm: &model_ocr
    <<: *ollama
    model: glm-ocr-optimized:latest
    params:
      temperature: 0.0
      # max_tokens 是必要的護欄而非最佳化：實測若不設限，模型會把辨識結果
      # 整段重複播放到 context 耗盡（見 .agent/plans/phase-2-execution-plan.md §1.2）
      max_tokens: 4096
    limits:
      policy: concurrency_only

# ── Agent ───────────────────────────────────────────────────────
agents:
  default:
    - ExtractAgent:
        name: ExtractAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/extract_cards.md
        output_schema: anki_deck_builder.schemas.extract_output.ExtractOutput
        model_params:
          <<: *model_extract

    # OCR 只回傳純文字，**不設 output_schema**——結構化抽取是 ExtractAgent 的職責。
    #
    # GLM-OCR 是 prompt-limited 模型，只吃兩類 prompt：
    #   Document Parsing      —— "Text Recognition:" / "Formula Recognition:" / "Table Recognition:"
    #   Information Extraction —— prompt 內嵌嚴格 JSON schema
    # 自擬指令會讓它退化成無限重複輸出（實測）。prompts/ocr_extract.md 因此
    # 只有一行官方前綴，**不要往裡面加任何說明文字**。
    - OCRAgent:
        name: OCRAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/ocr_extract.md
        model_params:
          <<: *model_ocr

    # vision_direct 路徑：影像直送抽取模型，跳過 OCR。
    # 與 ExtractAgent **共用同一個 output_schema**（硬性要求），差別只在
    # prompt 與輸入型態；模型同為 Gemma 4。
    #
    # extra_args 會原樣傳進 chat.completions.create()。reasoning_effort 不是
    # openai-agents 的 ModelSettings 欄位，只能走這裡。
    # **關閉思考是必要的而非最佳化**：實測讀整頁書影像時，4096 個 completion
    # token 會全部被思考吃光，content 回傳空字串、finish_reason=length
    # （見 .agent/plans/phase-2-execution-plan.md §2.3）。
    - VisionExtractAgent:
        name: VisionExtractAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/extract_cards_vision.md
        output_schema: anki_deck_builder.schemas.extract_output.ExtractOutput
        model_params:
          <<: *model_extract
          params:
            temperature: 0.0
            # **不要設 max_tokens**：影像路徑無法切段（圖不像文字能切開），
            # 一頁 94 個條目需要一萬多 token，設 4096 會讓 JSON 在中途被切斷
            # （實測 finish=length、13904 字的殘缺 JSON）。不設上限則 74 張卡、
            # finish=stop（見執行計畫 §2.10）
            extra_args:
              reasoning_effort: none

    # 補釋義：索引式教材（只有詞條、沒有釋義）的前置步驟。
    # 拆出來的理由：實測 8B 模型在單次呼叫裡同時做「憑知識生成」與「結構化輸出」
    # 會顧此失彼——整頁 101 張卡中有連續三段完全沒補例句（見執行計畫 §2.9）。
    # 拆開後這一步只輸出純文字，**不設 output_schema**。
    - EnrichAgent:
        name: EnrichAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/enrich_entries.md
        model_params:
          <<: *model_extract

    # 判斷教材是否已含釋義，決定要不要走補釋義路徑。
    # 獨立一次呼叫的理由：判斷與生成分離，兩件事都做得更好（見執行計畫 §2.9）；
    # 且輸出只有一個詞，8B 模型也很難出錯，成本可忽略。
    - MaterialTypeAgent:
        name: MaterialTypeAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/detect_material.md
        model_params:
          <<: *model_extract
          params:
            temperature: 0.2
            # 判斷任務不需要思考，而**開著思考會吃光這麼小的預算**——
            # 實測 max_tokens=16 加上思考時，content 回空字串（finish=length）
            max_tokens: 32
            extra_args:
              reasoning_effort: none

    # 構思聯想圖的**場景語義**（Phase 8 的語義層）。
    # 從 ExtractAgent 拆出來的理由與 EnrichAgent 相同：8B 模型在單次呼叫裡同時做
    # 「17 欄結構化填表」與「跨語言跨模態的創意視覺轉譯」會顧此失彼——2026-09-01
    # 實測，把避開文字道具的規則寫進 extract_cards.md 之後違規率仍是 4/13
    # （規則上線前是 67/308），規則進去了但模型沒照做。
    #
    # 產出**不含**風格詞、觸發詞與後綴：那些屬於語法層，由 profile 的
    # ImagePrompt*Agent 負責。只輸出一行純文字，**不設 output_schema**。
    - SceneAgent:
        name: SceneAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/image_scene.md
        model_params:
          <<: *model_extract
          params:
            temperature: 0.2
            max_tokens: 256
            extra_args:
              reasoning_effort: none

    # 對照頁面影像核對抽取結果（Phase 9）。
    # 與 VisionExtractAgent 一樣走視覺輸入，但工作完全不同：那個是「讀出來」，
    # 這個是「比對」。分開兩個 agent 而不是共用，因為指令的取向相反——
    # 抽取要盡量產出，核對要盡量克制（誤更正比漏更正嚴重）。
    #
    # **不設 max_tokens**：理由同 VisionExtractAgent，影像路徑截斷會吐出殘缺 JSON。
    - VerifyAgent:
        name: VerifyAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/verify_cards.md
        output_schema: anki_deck_builder.schemas.verify_output.VerifyOutput
        model_params:
          <<: *model_extract
          params:
            temperature: 0.15
            extra_args:
              reasoning_effort: none

    # ── 語法層：一個 profile 一個 agent（Phase 8）──────────────────
    #
    # 模型專屬的三件事——目標語法、LoRA 觸發詞、風格後綴——全部寫在各自的
    # prompt 檔裡，**不散在 .env**。Phase 7 曾把觸發詞做成 COMFYUI_PROMPT_PREFIX，
    # Phase 8 移除了它：同一件事有兩個機制，換模型時忘了清哪一邊就會出事。
    #
    # 換模型 = 改 .env 的 IMAGE_PROMPT_AGENT 加 workflow 那組節點 ID，
    # 然後 `anki-builder prompt --force`。語義層（image_scene）完全不動。
    #
    # 兩者都只輸出一行純文字，**不設 output_schema**。

    # 生效中：FLUX.2-klein-9B ＋ KyoAni Style LoRA。自然語言敘述式 ＋ `Anime. ` 觸發詞
    - ImagePromptFluxAgent:
        name: ImagePromptFluxAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/image_prompt_flux.md
        model_params:
          <<: *model_extract
          params:
            temperature: 0.2
            max_tokens: 512
            extra_args:
              reasoning_effort: none

    # 回頭路：fabricatedXL / SDXL。逗號 tag 式 ＋ 統一風格後綴，場景原樣照抄
    - ImagePromptSDXLAgent:
        name: ImagePromptSDXLAgent
        model_instruction:
          dynamic_prompt: false
          instruction_file_path: ${__dir__}/prompts/image_prompt_sdxl.md
        model_params:
          <<: *model_extract
          params:
            temperature: 0.2
            max_tokens: 512
            extra_args:
              reasoning_effort: none
