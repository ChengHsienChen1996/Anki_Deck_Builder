[project]
name = "anki-deck-builder"
version = "0.1.0"
description = "本地製卡 pipeline：書本影像或純文字 → 七階段處理 → Anki 記憶引擎可載入的牌組 ZIP"
readme = "README.md"
authors = [
    { name = "ChengHsienChen1996", email = "g8963458741@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # LLM / OCR 底層（git submodule，見 [tool.uv.sources]）
    # 連帶引入 openai-agents、omegaconf、aiolimiter、tiktoken、python-dotenv
    "openai-agent-sdk-factory",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "voxcpm>=2.0.3",
    "pypdfium2>=5.13.0",
    # ComfyUI 的完成訊號走 WebSocket（官方 API 範例方法 2）；httpx 不支援 WS
    "websockets>=13",
    # 牌組媒體轉檔：PNG → WebP。soundfile（voxcpm 帶入）負責 WAV → MP3，
    # 兩者都不需要 ffmpeg（見 stages/media_encode.py）
    "pillow>=10",
    # Phase 5 Web UI：Gradio 掛載於 FastAPI（gr.mount_gradio_app）
    "fastapi>=0.141",
    "gradio>=6.26,<7",
    "uvicorn[standard]>=0.52",
]

# Phase 3 以後才加：無
# Phase 2 才加：pypdfium2

[project.optional-dependencies]
# 版面偵測（Phase 9）。**刻意是選配**：它只服務「OCR 分塊輸入」這一個功能，
# 關掉時整條流程照常運作（退回整頁送 OCR）。連帶引入 torchvision。
#
# 實測解析出的 torch 與專案現有的完全相同（2.13.0+cu130），不會動到 VOXCPM2。
layout = [
    "doclayout-yolo>=0.0.4",
    "huggingface-hub>=0.34",
]
# 日文形態素分析（2026-09-07）。**刻意是選配，也刻意不接進流程**：
# 日文限定，而本專案的目標是支援任意學習領域（見 docs/project-overview.md）。
# 裝了才有 scripts/kana-tts-back.py 與 check-card-quality.py 的兩項檢查可用。
#
# 初版用 pykakasi，實測換掉：它是字典式轉換、沒有上下文模型，多音字只能猜。
# 334 張例句的差異比對中 SudachiPy 對 24 筆、錯 5 筆（後者由覆寫表收掉）。
kana = [
    "sudachipy>=0.6",
    "sudachidict-core>=20250000",
]

# `dev` **刻意不是 extra**（2026-09-10 從 optional-dependencies 搬過來）。
#
# `uv sync` 的語意是「環境精確等於你指定的集合」，沒點名的一律移除。
# 開發工具當成 extra 的話，任何一次 `uv sync --extra layout` 都會把 pytest 與
# ruff 剪掉——實測踩過，而且 layout 沒裝時 `OCR_CHUNK_ENABLED=true` 會讓
# `ocr` 階段直接拋 ConfigurationError，兩件事疊起來很難查。
#
# dependency-group（PEP 735）**預設就會裝**，`uv sync` 不帶任何旗標也不會弄丟。
# 與 submodule `src/agent_factory/pyproject.toml` 的做法一致。
#
# layout 與 kana 留在 optional-dependencies：它們是「功能開關」，
# 關掉時流程仍然可用（分塊退回整頁送；kana 腳本本來就不接進流程）。
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[project.scripts]
# 實作於 Phase 1 Task 1.11
anki-builder = "anki_deck_builder.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/ 下同時存在 agent_factory submodule，須明確指定本專案的套件
module-name = "anki_deck_builder"

[tool.uv.sources]
openai-agent-sdk-factory = { path = "src/agent_factory", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# submodule 屬外部 repo，不納入本專案 lint
extend-exclude = ["src/agent_factory"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# strict：async 測試必須明確標記 @pytest.mark.asyncio（見 docs/testing-strategy.md）
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "manual: 需人工執行（LLM／本地模型推理），預設不跑",
]
addopts = ["-m", "not manual"]
